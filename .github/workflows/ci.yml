name: v0.1 test and build
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure fictional local database
        run: cp .env.example server/.env
      - name: Seed database
        run: npm run seed
      - name: Unit, API, and frontend tests with coverage
        run: npm run test:coverage
      - name: Verify production frontend build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end M1-M4 flows
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v01-test-artifacts
          path: |
            playwright-report/
            test-results/
            coverage/
          if-no-files-found: ignore
